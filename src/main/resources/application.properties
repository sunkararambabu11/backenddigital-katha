spring.application.name=springbootapp

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/digitalkatha
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Dialect auto-detected by Hibernate for MySQL 9.x

# Server
server.port=8081

# OpenAI API Key (can be set via OPENAI_API_KEY environment variable or specified here)
openai.api.key=${OPENAI_API_KEY:YOUR_API_KEY_HERE}
